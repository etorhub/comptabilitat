server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Darrere del túnel de Cloudflare: els encapçalaments de mida ja venen filtrats.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Comprovació de salut del contenidor, sense passar per l'API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cal perquè l'aplicació sàpiga que la connexió original era HTTPS
        # i marqui les galetes de sessió com a segures.
        proxy_set_header X-Forwarded-Proto https;
        # Les exportacions i les sincronitzacions poden tardar.
        proxy_read_timeout 300s;
    }

    # Els fitxers amb resum al nom no canvien mai: es poden guardar per sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicació d'una sola pàgina: qualsevol ruta desconeguda torna l'index.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
