# Stack per provar-ho a la teva maquina.
#
#   docker compose -f deploy/docker-compose.local.yml up -d --build
#   docker compose -f deploy/docker-compose.local.yml exec app bun run cli demo
#   obre http://localhost:8080
#
# A diferencia del de produccio: publica ports a localhost, no necessita ni el
# tunel de Cloudflare ni les claus d'Enable Banking, i les galetes no son
# «secure» perque aqui no hi ha HTTPS.
#
# Ja no hi ha contenidor `web`: l'aplicacio serveix el seu propi HTML i els
# seus estatics. El 8080 es manté com a port public perque totes les adreces
# de la documentacio segueixin valent.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comptabilitat
      POSTGRES_PASSWORD: comptabilitat
      POSTGRES_DB: comptabilitat
    ports:
      # Per poder-hi entrar amb psql o amb un client grafic des de la maquina.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comptabilitat"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
    restart: unless-stopped
    command: ["app"]
    environment: &entorn
      DATABASE_URL: postgresql://comptabilitat:comptabilitat@db:5432/comptabilitat
      ENVIRONMENT: local
      DEBUG: "true"
      SECRET_KEY: clau-nomes-per-a-proves-locals-32-caracters
      PUBLIC_BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      TIMEZONE: Europe/Madrid
      OLLAMA_ENABLED: "${OLLAMA_ENABLED:-false}"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      # Omple-les nomes si vols provar el sandbox d'Enable Banking.
      EB_APPLICATION_ID: "${EB_APPLICATION_ID:-}"
      EB_PRIVATE_KEY: "${EB_PRIVATE_KEY:-}"
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy

  # Sense planificador per defecte: aqui les feines es llancen a ma amb
  # `bun run jobs sync|classify|llm|analyze|notify`. Per tenir-lo:
  # `docker compose -f deploy/docker-compose.local.yml --profile cron up -d`.
  worker:
    build:
      context: ..
    restart: unless-stopped
    command: ["worker"]
    profiles: [cron]
    environment: *entorn
    depends_on:
      app:
        condition: service_healthy

  # Opcional: `docker compose -f deploy/docker-compose.local.yml --profile ai up -d`
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ai]
    volumes:
      - ollama_local:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  db_local:
  ollama_local:
