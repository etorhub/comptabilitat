# Stack per a Portainer (compose path: docker-compose.yml).
# Per desplegar des de deploy/: docker compose -f deploy/docker-compose.yml up -d
#
# Amb el canvi de pila desapareix el contenidor `web`: la interficie ja no es
# una aplicacio de React servida per nginx, sino HTML que genera la mateixa
# aplicacio. El tunel hi va directe.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comptabilitat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cal definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-comptabilitat}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comptabilitat}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  app:
    build:
      context: .
    restart: unless-stopped
    command: ["app"]
    env_file: [stack.env]
    environment: &entorn
      # El servidor de Bun no enten el prefix de SQLAlchemy, pero el treu ell
      # mateix si encara hi es (vegeu `lib/config.ts`).
      DATABASE_URL: postgresql://${POSTGRES_USER:-comptabilitat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptabilitat}
    depends_on:
      db:
        condition: service_healthy
    # La comprovacio de salut es la de la imatge: GET /salut.
    networks: [interna, externa]

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["worker"]
    env_file: [stack.env]
    environment: *entorn
    depends_on:
      app:
        condition: service_healthy
    # La imatge comprova /salut, que el planificador no serveix.
    healthcheck:
      disable: true
    networks: [interna, externa]

  # Per defecte no s'arrenca: reutilitza el cloudflared que ja tinguis al NAS.
  # Per usar el tunel integrat: `docker compose --profile tunnel up -d`.
  # Apunta'l a `app:8000`; el `web:8080` d'abans ja no hi es.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    networks: [interna, externa]

  # Opcional: s'arrenca amb `docker compose --profile ai up -d`.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ai]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Un sol model carregat i descarrega rapida: el NAS te RAM limitada.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_NUM_PARALLEL: "1"
    networks: [interna]

  # Copia de seguretat diaria de la base de dades.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-comptabilitat}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-comptabilitat}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./deploy/backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

# Enable Banking: Portainer clona el git sense `deploy/secrets/` (gitignorat),
# aixi que no es pot muntar el PEM com a secret de Docker. El desplegament
# injecta `EB_PRIVATE_KEY_B64` a les variables de l'stack (vegeu
# deploy/scripts/portainer-deploy.py). El client la llegeix abans del fitxer.

networks:
  # Sense sortida a internet: nomes trafic entre contenidors.
  interna:
    internal: true
  # Nomes per als serveis que han de sortir a fora (API del banc, SMTP, tunel).
  externa:

volumes:
  db_data:
  ollama_models:
