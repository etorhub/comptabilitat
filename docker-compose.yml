# Stack de produccio, pensat per desplegar-lo des del git amb Portainer.
#
# Amb el canvi de pila desapareix el contenidor `web`: la interficie ja no es
# una aplicacio de React servida per nginx, sino HTML que genera la mateixa
# aplicacio. El tunel de Cloudflare hi va directe.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comptabilitat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cal definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-comptabilitat}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comptabilitat}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    restart: unless-stopped
    command: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment: &entorn
      DATABASE_URL: postgresql://${POSTGRES_USER:-comptabilitat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptabilitat}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?cal definir SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?cal definir PUBLIC_BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      EB_APPLICATION_ID: ${EB_APPLICATION_ID:-}
      EB_PRIVATE_KEY_PATH: ${EB_PRIVATE_KEY_PATH:-/run/secrets/eb_private_key}
      EB_PRIVATE_KEY_B64: ${EB_PRIVATE_KEY_B64:-}
      EB_DEFAULT_ASPSP_NAME: ${EB_DEFAULT_ASPSP_NAME:-Santander}
      EB_DEFAULT_ASPSP_COUNTRY: ${EB_DEFAULT_ASPSP_COUNTRY:-ES}
      EB_CONSENT_DAYS: ${EB_CONSENT_DAYS:-90}
      EB_INITIAL_HISTORY_MONTHS: ${EB_INITIAL_HISTORY_MONTHS:-24}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      SYNC_CRON_HOUR: ${SYNC_CRON_HOUR:-6}
      SYNC_CRON_MINUTE: ${SYNC_CRON_MINUTE:-30}
      ANALYSIS_CRON_HOUR: ${ANALYSIS_CRON_HOUR:-4}
    secrets:
      - eb_private_key

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy
    environment: *entorn
    secrets:
      - eb_private_key

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles: ["tunel"]

secrets:
  eb_private_key:
    file: ./deploy/secrets/eb_private_key.pem

volumes:
  db_data:
