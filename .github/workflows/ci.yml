name: CI

on:
  # The main branch only: `pull_request` already covers the rest. If both
  # listened to every branch, each push with an open PR would launch two
  # identical runs.
  push:
    branches: [master]
  pull_request:

# A new push makes whatever is still running pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # No database service and no DATABASE_URL: if a test in this round gets as
    # far as making a query, it fails here. That is what keeps the separation
    # honest, and what proves `htmx-contract/` can be lifted into a package of
    # its own.
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: una-clau-de-proves-de-32-caracters-o-mes
      PUBLIC_BASE_URL: http://localhost:8000
      COOKIE_SECURE: "false"
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: bun install --frozen-lockfile

      - name: Tests with no database
        run: bun run test:unit

  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comptabilitat
          POSTGRES_PASSWORD: comptabilitat
          POSTGRES_DB: comptabilitat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comptabilitat -d comptabilitat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://comptabilitat:comptabilitat@127.0.0.1:5432/comptabilitat_test
      # For the tests only: it opens nothing. The configuration has a default and
      # `validateConfig()` only throws with ENVIRONMENT=production, but better
      # that the tests do not depend on the default value.
      SECRET_KEY: una-clau-de-proves-de-32-caracters-o-mes
      PUBLIC_BASE_URL: http://localhost:8000
      COOKIE_SECURE: "false"
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: bun install --frozen-lockfile

      # The types first: it is what fails fastest and says the most.
      - name: Types (src and tests)
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Boundary of the extractable pieces
        run: bun run boundary

      # The generated tables come from `src/lib/oob.ts` and `src/routes/`. This
      # is the step that stops the documentation drifting away from the code,
      # which is the whole reason it is generated.
      - name: Generated documentation
        run: bun run docs:check

      # The schema comes from the migrations, as in production.
      - name: Migrations
        run: bun run db:apply

      - name: Tests
        run: bun test
        env:
          SKIP_MIGRATIONS: "true"
